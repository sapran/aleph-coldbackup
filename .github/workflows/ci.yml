name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Deny everything by default; each job grants only what it needs below.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Cloning is all this job needs. Required explicitly: while the repository is
    # private, checkout cannot read it under the top-level `permissions: {}`.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # Mirrors the contributor path in CONTRIBUTING.md exactly. `uv pip install`
      # refuses to run without a virtual environment, and setup-uv does not
      # create one.
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # Integration tests need a live Aleph and are deselected by the `addopts`
      # in pyproject.toml, so this runs the self-contained suite only.
      # --no-sync so each step tests exactly what the install step produced;
      # without it `uv run` re-resolves against uv.lock before every command.
      - name: Tests
        run: uv run --no-sync pytest

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Type check
        run: uv run --no-sync mypy src tests
