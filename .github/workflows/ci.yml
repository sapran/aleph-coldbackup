name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Deny everything by default; each job grants only what it needs below.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Cloning is all this job needs. Granted explicitly because the top-level
    # `permissions: {}` leaves GITHUB_TOKEN with no scopes at all, and checkout
    # then fails with a 404 on a private repository.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # The install path from CONTRIBUTING.md. `uv pip install` refuses to run
      # without a virtual environment, and setup-uv does not create one.
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # --no-sync on each step so they exercise exactly what the install
      # produced; without it `uv run` re-resolves against uv.lock every time.
      # Integration tests need a live Aleph and are already deselected by the
      # `addopts` in pyproject.toml, so this is the self-contained suite only.
      - name: Tests
        run: uv run --no-sync pytest

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Type check
        run: uv run --no-sync mypy src tests
