version: 2

updates:
  # Python dependencies, resolved through uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a freshly published version age before adopting it — a hijacked release
    # is usually yanked within days.
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # Keeps the commit-SHA pins in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
