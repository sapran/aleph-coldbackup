[project]
name = "aleph-coldbackup"
version = "0.1.0"
description = "Export an Aleph investigation into a re-ingestable cold backup (API-only)."
requires-python = ">=3.11"
dependencies = ["alephclient", "requests"]

[project.scripts]
aleph-coldbackup = "aleph_coldbackup.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.4", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_coldbackup"]

[tool.pytest.ini_options]
markers = ["integration: requires a live Aleph API (ALEPHCLIENT_HOST/API_KEY)"]
addopts = "-m 'not integration'"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
packages = ["aleph_coldbackup"]

[[tool.mypy.overrides]]
module = "alephclient.*"
ignore_missing_imports = true
